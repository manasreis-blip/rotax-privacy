<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>ROTAX — Canlı Konum</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0B0E13;
    --panel: #12161F;
    --border: #232B38;
    --text: #E9ECF2;
    --muted: #7C8798;
    --amber: #FFB020;
    --red: #FF4D6D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .brand { font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--amber); }
  .who { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #map { flex: 1 1 auto; width: 100%; background: var(--panel); }
  footer {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    flex: 0 0 auto;
  }
  .center {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
  }
  .center h1 { font-size: 18px; margin: 0; }
  .center p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; max-width: 360px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber); margin-right: 6px; vertical-align: middle;
  }
  .leaflet-container { background: #12161F; }
</style>
</head>
<body>

<div id="loading" class="center">
  <h1>Konum yükleniyor…</h1>
  <p>Bağlantı doğrulanıyor.</p>
</div>

<div id="error" class="center" style="display:none">
  <h1 id="errTitle">Bağlantı geçersiz</h1>
  <p id="errText">Bu takip bağlantısı geçersiz ya da süresi dolmuş.</p>
</div>

<header id="head" style="display:none">
  <div class="brand">ROTAX</div>
  <div class="who" id="who">—</div>
  <div class="meta"><span class="dot"></span><span id="meta">—</span></div>
</header>

<div id="map" style="display:none"></div>

<footer id="foot" style="display:none">
  Bu sayfa yalnızca paylaşımın süresi dolana kadar çalışır.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // --- Ayarlar: ROTAX Supabase projesi ---
  var SUPABASE_URL = "https://cdwanvstithbhbzyizay.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_SupMG5ObLxNPeMPRrOWv7A_mwM5dRMB";

  var token = (location.hash || "").replace(/^#/, "").trim();

  var map = null, marker = null, circle = null;

  function show(id) { document.getElementById(id).style.display = ""; }
  function hide(id) { document.getElementById(id).style.display = "none"; }

  function fail(msg) {
    hide("loading"); hide("head"); hide("map"); hide("foot");
    if (msg) document.getElementById("errText").textContent = msg;
    show("error");
  }

  function zamanMetni(iso) {
    if (!iso) return "konum bilgisi yok";
    var dk = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (dk < 1) return "az önce güncellendi";
    if (dk < 60) return dk + " dakika önce güncellendi";
    var saat = Math.floor(dk / 60);
    return saat + " saat önce güncellendi";
  }

  function kalanSure(iso) {
    if (!iso) return "";
    var dk = Math.floor((new Date(iso).getTime() - Date.now()) / 60000);
    if (dk <= 0) return "süresi doldu";
    if (dk < 60) return dk + " dakika kaldı";
    return Math.floor(dk / 60) + " saat kaldı";
  }

  function ciz(lat, lng) {
    if (!map) {
      map = L.map("map", { zoomControl: true, attributionControl: true }).setView([lat, lng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      marker = L.circleMarker([lat, lng], {
        radius: 9, color: "#FFB020", fillColor: "#FFB020", fillOpacity: 1, weight: 3
      }).addTo(map);
      circle = L.circle([lat, lng], { radius: 60, color: "#FFB020", fillColor: "#FFB020", fillOpacity: .12, weight: 1 }).addTo(map);
    } else {
      marker.setLatLng([lat, lng]);
      circle.setLatLng([lat, lng]);
      map.panTo([lat, lng]);
    }
  }

  function getir(ilk) {
    fetch(SUPABASE_URL + "/rest/v1/rpc/get_shared_location", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_token: token })
    })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || "Bağlantı geçersiz."); });
        return r.json();
      })
      .then(function (rows) {
        var d = Array.isArray(rows) ? rows[0] : rows;
        if (!d) throw new Error("Bağlantı geçersiz ya da süresi dolmuş.");

        document.getElementById("who").textContent = (d.display_name || "Kullanıcı") + " yolda";

        if (d.lat == null || d.lng == null) {
          document.getElementById("meta").textContent = "Henüz konum paylaşılmadı — uygulamada konum açık olmalı.";
        } else {
          document.getElementById("meta").textContent =
            zamanMetni(d.seen_at) + " · " + kalanSure(d.valid_until);
        }

        if (ilk) { hide("loading"); show("head"); show("map"); show("foot"); }
        if (d.lat != null && d.lng != null) {
          if (ilk) setTimeout(function () { ciz(d.lat, d.lng); }, 50);
          else ciz(d.lat, d.lng);
        }
      })
      .catch(function (e) { if (ilk) fail(e.message); });
  }

  if (!token) {
    fail("Bağlantı eksik görünüyor. Size gönderilen linkin tamamını açtığınızdan emin olun.");
  } else {
    getir(true);
    setInterval(function () { getir(false); }, 20000); // 20 saniyede bir tazele
  }
</script>
</body>
</html>
